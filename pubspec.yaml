name: speech2sign
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_tts: ^4.2.5
  get: ^4.7.3
  google_fonts: ^9.0.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  speech_to_text: ^7.5.0
  tflite_flutter: ^0.12.1
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/komponen_img/
    - assets/models/bisindo/
    - assets/models/sibi/
    - assets/sign_language/
    - assets/sign_language/offline/bisindo/alfabet/
    - assets/sign_language/offline/bisindo/kalimat/
    - assets/sign_language/offline/sibi/kalimat/
